<div class="post-card" *ngIf="post">
  <div class="post-header">
    <div class="post-header-left" (click)="navigateToProfile()">
      <div class="avatar-wrapper">
        <img [src]="post.avatar" alt="avatar" (error)="$event.target.src='/avatarka.jpg'">
      </div>
      <span class="username">{{ post.username }}</span>
    </div>
    <div class="post-header-actions" *ngIf="isOwnPost()">
      <button class="edit-post-btn" (click)="openEditModal()" title="Редактировать">
        ✏️
      </button>
    </div>
  </div>

  <div class="post-image">
    <img 
      [src]="post.image" 
      alt="content"
      (error)="handleImageError($event)"
      loading="lazy"
    >

    <div class="image-overlay">
      <button 
        class="action-btn heart" 
        [class.active]="post.isLiked"
        (click)="toggleLike(); $event.stopPropagation()"
        [disabled]="isLiking"
      >
        {{ post.isLiked ? '❤️' : '🤍' }}
      </button>
      <button 
        class="action-btn message" 
        (click)="toggleComments(); $event.stopPropagation()"
      >
        💬
      </button>
    </div>
  </div>

  <div class="post-footer">
    <div class="post-actions">
      <button 
        class="action-btn-text"
        [class.active]="post.isLiked"
        (click)="toggleLike()"
        [disabled]="isLiking"
      >
        ❤️ {{ post.likesCount || 0 }}
      </button>
      <button 
        class="action-btn-text"
        (click)="toggleComments()"
      >
        💬 {{ post.commentsCount || 0 }}
      </button>
    </div>

    <p class="description">
      <strong>{{ post.username }}</strong> {{ post.description }}
    </p>

    <div class="comments-section" *ngIf="showComments">
      <div class="comments-list" *ngIf="post.comments && post.comments.length > 0">
        <div class="comment-item" *ngFor="let comment of post.comments; trackBy: trackByCommentId">
          <div class="comment-avatar">
            <img [src]="comment.avatar" alt="avatar" (error)="$event.target.src='/avatarka.jpg'">
          </div>
          <div class="comment-content">
            <strong class="comment-username">{{ comment.username }}</strong>
            <span class="comment-text">{{ comment.text }}</span>
          </div>
        </div>
      </div>

      <div class="comment-form">
        <input 
          type="text" 
          class="comment-input"
          [(ngModel)]="commentText"
          placeholder="Добавить комментарий..."
          (keyup.enter)="addComment()"
          [disabled]="isCommenting"
        >
        <button 
          class="comment-submit"
          (click)="addComment()"
          [disabled]="!commentText.trim() || isCommenting"
        >
          Отправить
        </button>
      </div>
    </div>

    <span class="post-time">{{ getTimeAgo(post.createdAt) }}</span>
  </div>

  <!-- Модалка редактирования поста -->
  <div *ngIf="showEditModal" class="edit-modal-overlay" (click)="closeEditModal()">
    <div class="edit-modal-content" (click)="$event.stopPropagation()">
      <div class="edit-modal-header">
        <h2 class="edit-modal-title">Редактировать пост</h2>
        <button class="edit-modal-close" (click)="closeEditModal()">×</button>
      </div>
      <div class="edit-modal-body">
        <div class="edit-form-group">
          <label class="edit-form-label">Описание</label>
          <textarea
            class="edit-form-textarea"
            [(ngModel)]="editDescription"
            placeholder="Описание поста..."
            rows="4"
          ></textarea>
        </div>
        <div class="edit-form-group">
          <label class="edit-form-label">Изображение</label>
          <input
            type="file"
            id="edit-image-input"
            accept="image/*"
            (change)="handleEditImageInput($event)"
            class="edit-form-file-input"
          />
          <div *ngIf="editImage" class="edit-image-preview">
            <img [src]="editImage" alt="Превью" />
          </div>
          <label for="edit-image-input" class="edit-form-image-btn">
            Изменить изображение
          </label>
        </div>
      </div>
      <div class="edit-modal-footer">
        <button type="button" class="edit-btn-cancel" (click)="closeEditModal()">
          Отмена
        </button>
        <button 
          type="button" 
          class="edit-btn-save" 
          (click)="saveEdit()"
          [disabled]="isUpdating"
        >
          {{ isUpdating ? 'Сохранение...' : 'Сохранить' }}
        </button>
      </div>
    </div>
  </div>
</div>
